name: build
on:
  push:
    paths-ignore:
      - 'last-build.log'
      - 'app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q stacked-recents-src.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: build
        id: b
        continue-on-error: true
        working-directory: src
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
      - name: publish
        if: always()
        run: |
          cp src/build.log last-build.log 2>/dev/null || echo "no log" > last-build.log
          if [ -f src/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp src/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
            git add app-debug.apk
          fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add last-build.log
          git commit -m "ci: build artifacts ($(date -u +%H%M%S))" || true
          git push || true
      - if: steps.b.outcome == 'failure'
        run: exit 1

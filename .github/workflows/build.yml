name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q stacked-recents-src.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: build
        id: b
        continue-on-error: true
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: summary
        if: steps.b.outcome == 'failure'
        run: |
          echo '## 构建失败，最后 120 行日志' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 src/build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            src/app/build/outputs/apk/debug/*.apk
            src/build.log
      - if: steps.b.outcome == 'failure'
        run: exit 1
